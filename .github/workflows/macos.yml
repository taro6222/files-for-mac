name: macOS verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_upgrade:
        description: Verify preview replacement and rollback
        type: boolean
        default: false
      verify_full_appkit:
        description: Verify the complete AppKit suite and capture windows
        type: boolean
        default: false
      verify_xcode:
        description: Build the native Xcode project on both architectures
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  verify-xcode:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_xcode
    name: Xcode (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check generated project and build the native app
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          python3 scripts/generate-xcode-project.py
          git diff --exit-code -- FilesMac.xcodeproj
          xcodebuild -project FilesMac.xcodeproj -scheme 'Files macOS' \
            -configuration Debug -destination "platform=macOS,arch=$EXPECTED_ARCH" \
            -derivedDataPath build/xcode-verification CODE_SIGNING_ALLOWED=NO build
          app='build/xcode-verification/Build/Products/Debug/Files macOS.app'
          test -x "$app/Contents/MacOS/Files macOS"
          test "$(/usr/libexec/PlistBuddy -c 'Print :FilesReleaseChannel' "$app/Contents/Info.plist")" = preview
  verify:
    if: github.event_name != 'workflow_dispatch' || !inputs.verify_xcode || inputs.verify_full_appkit || inputs.verify_upgrade
    name: macOS 15 (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            debug_build_minutes: 12
          - runner: macos-15-intel
            architecture: x86_64
            debug_build_minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify runner and toolchain
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          sw_vers
          uname -m
          test "$(uname -m)" = "$EXPECTED_ARCH"
          xcodebuild -version
          swift --version
      - name: Audit parity inventories
        run: python3 scripts/audit-parity.py
      - name: Build app and test targets
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_upgrade || inputs.verify_full_appkit
        timeout-minutes: ${{ matrix.debug_build_minutes }}
        run: swift build --build-tests --disable-sandbox -Xswiftc -gnone
      - name: Run Swift tests
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_upgrade
        timeout-minutes: 5
        run: swift test --skip-build --disable-xctest --no-parallel
      - name: Verify Git scheduling with a constrained Swift executor
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_upgrade
        timeout-minutes: 2
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: '1'
        run: swift test --skip-build --disable-xctest --filter 'gitConcurrentSnapshotsCompleteWithoutBlockingSwiftTasks|gitWaitingForProcessAllowsOtherSwiftTasksToResume|gitCancellationTerminatesProcessAndCleansCloneStaging'
      - name: Verify mounted file systems and AppKit file operations
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_upgrade
        timeout-minutes: 14
        run: bash scripts/verify-volume-matrix.sh --skip-build --appkit
      - name: Prepare Spotlight for AppKit content search
        if: github.event_name == 'workflow_dispatch' && inputs.verify_full_appkit
        timeout-minutes: 4
        run: |
          source_file="$PWD/Sources/FilesCore/LocalSearch.swift"
          query='kMDItemTextContent == "*SearchRouter*"cd'
          indexed() {
            /usr/bin/mdfind -onlyin "$PWD" "$query" | /usr/bin/grep -Fx "$source_file" >/dev/null
          }
          if ! indexed; then
            sudo /usr/bin/mdutil -i on /System/Volumes/Data
            /usr/bin/mdimport -i "$source_file"
            for attempt in {1..45}; do
              if indexed; then break; fi
              sleep 2
            done
          fi
          if ! indexed; then
            echo "Spotlight did not index $source_file on this runner." >&2
            exit 1
          fi
      - name: Verify the complete AppKit suite
        if: github.event_name == 'workflow_dispatch' && inputs.verify_full_appkit
        timeout-minutes: 14
        run: |
          export TMPDIR="$RUNNER_TEMP"
          bash scripts/verify-ui.sh --binary "$(swift build --show-bin-path)/FilesMac"
      - name: Retain AppKit reports and window captures
        if: always() && github.event_name == 'workflow_dispatch' && inputs.verify_full_appkit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: files-appkit-macos15-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/files-ui-verification.*/*/report.json
            ${{ runner.temp }}/files-ui-verification.*/*/run.log
            ${{ runner.temp }}/files-ui-verification.*/*/timeout-sample.txt
            ${{ runner.temp }}/files-ui-verification.*/*/*.png
          if-no-files-found: ignore
      - name: Build and launch the installed developer preview
        if: github.event_name != 'pull_request'
        timeout-minutes: 15
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          bash scripts/build-dmg.sh --preview
          python3 scripts/verify-preview-install.py build/Files-macOS-preview.dmg \
            --startup --launch-services --expect-architecture "$EXPECTED_ARCH"
      - name: Check out the previous preview source
        if: github.event_name == 'workflow_dispatch' && inputs.verify_upgrade
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Previous preview with the Swift 6.2 compiler compatibility fix.
          ref: 0a7b50b50adfa810c8d93802e4b532f1ff2080e2
          path: build/previous-preview
          persist-credentials: false
      - name: Verify preview replacement and rollback
        if: github.event_name == 'workflow_dispatch' && inputs.verify_upgrade
        timeout-minutes: 17
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          bash build/previous-preview/scripts/build-dmg.sh --preview
          python3 scripts/verify-preview-install.py \
            build/previous-preview/build/Files-macOS-preview.dmg build/Files-macOS-preview.dmg \
            --expect-architecture "$EXPECTED_ARCH"
