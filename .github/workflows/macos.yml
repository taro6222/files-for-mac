name: macOS verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: macOS 15 (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify runner and toolchain
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          sw_vers
          uname -m
          test "$(uname -m)" = "$EXPECTED_ARCH"
          xcodebuild -version
          swift --version
      - name: Audit parity inventories
        run: python3 scripts/audit-parity.py
      - name: Build app and test targets
        timeout-minutes: 12
        run: swift build --build-tests --disable-sandbox
      - name: Run Swift tests
        timeout-minutes: 5
        run: swift test --skip-build --disable-xctest
      - name: Verify mounted file systems
        timeout-minutes: 5
        run: bash scripts/verify-volume-matrix.sh
