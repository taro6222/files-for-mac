name: macOS verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_upgrade:
        description: Verify preview replacement and rollback
        type: boolean
        default: false
      verify_full_appkit:
        description: Verify the complete AppKit suite and capture windows
        type: boolean
        default: false
      verify_performance:
        description: Measure optimized warm-cache performance on both CPUs
        type: boolean
        default: false
      verify_xcode:
        description: Build the native Xcode project on both architectures
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  verify-xcode:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_xcode
    name: Xcode (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check generated project and build the native app
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          python3 scripts/generate-xcode-project.py
          git diff --exit-code -- FilesMac.xcodeproj
          xcodebuild -project FilesMac.xcodeproj -scheme 'Files macOS' \
            -configuration Debug -destination "platform=macOS,arch=$EXPECTED_ARCH" \
            -derivedDataPath build/xcode-verification CODE_SIGNING_ALLOWED=NO build
          app='build/xcode-verification/Build/Products/Debug/Files macOS.app'
          test -x "$app/Contents/MacOS/Files macOS"
          test "$(/usr/libexec/PlistBuddy -c 'Print :FilesReleaseChannel' "$app/Contents/Info.plist")" = preview
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.verify_full_appkit || inputs.verify_upgrade || (!inputs.verify_xcode && !inputs.verify_performance)
    name: macOS 15 (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_full_appkit && 90 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            debug_build_minutes: 12
            appkit_timeout_seconds: 180
            appkit_step_minutes: 14
          - runner: macos-15-intel
            architecture: x86_64
            debug_build_minutes: 20
            appkit_timeout_seconds: 600
            appkit_step_minutes: 44
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify runner and toolchain
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          sw_vers
          uname -m
          test "$(uname -m)" = "$EXPECTED_ARCH"
          xcodebuild -version
          swift --version
      - name: Audit parity inventories
        run: python3 scripts/audit-parity.py
      - name: Verify Spotlight fixture ownership guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s Tests/FixtureTests -p 'test_spotlight_volume_fixture.py'
      - name: Verify archive reference acquisition guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s Tests/FixtureTests -p 'test_sevenzip_reference.py'
      - name: Verify unmounted Spotlight image cleanup
        if: github.event_name == 'workflow_dispatch' && inputs.verify_full_appkit
        timeout-minutes: 5
        run: |
          python3 scripts/prepare-spotlight-fixture.py prepare --state build/spotlight-unmounted-fixture/state.json --isolated-volume --enable-indexing
          python3 scripts/verify-spotlight-unmounted-cleanup.py --state build/spotlight-unmounted-fixture/state.json --output build/spotlight-unmounted-fixture/verification.json --verify-foreign-data
      - name: Build app and test targets
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_upgrade || inputs.verify_full_appkit
        timeout-minutes: ${{ matrix.debug_build_minutes }}
        run: swift build --build-tests --disable-sandbox -debug-info-format none
      - name: Run Swift tests
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_upgrade
        timeout-minutes: 5
        run: swift test --skip-build --disable-xctest --no-parallel
      - name: Verify Git and directory scheduling with a constrained Swift executor
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_upgrade
        timeout-minutes: 2
        run: python3 scripts/verify-git-scheduling.py
      - name: Verify archives with the pinned official 7-Zip reference
        if: github.event_name == 'workflow_dispatch' && inputs.verify_full_appkit
        timeout-minutes: 5
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify-sevenzip-reference.py --output build/sevenzip-verification
      - name: Retain independent archive verification
        if: always() && github.event_name == 'workflow_dispatch' && inputs.verify_full_appkit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: files-archive-interop-${{ matrix.architecture }}
          path: |
            build/sevenzip-verification/result.json
            build/sevenzip-verification/interoperability.json
            build/sevenzip-verification/reference-provenance.json
            build/sevenzip-verification/run.log
          if-no-files-found: ignore
      - name: Retain Git scheduling diagnostics
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.verify_upgrade)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: files-git-scheduling-${{ matrix.architecture }}
          path: build/git-scheduling-verification/
          if-no-files-found: ignore
      - name: Verify mounted file systems and AppKit file operations
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_upgrade
        timeout-minutes: 14
        run: bash scripts/verify-volume-matrix.sh --skip-build --appkit
      - name: Verify AppKit file promise export contracts
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_upgrade
        timeout-minutes: 2
        env:
          TMPDIR: ${{ runner.temp }}
        run: bash scripts/verify-file-promises.sh --contract --binary "$(swift build --show-bin-path)/FilesMac"
      - name: Retain file promise contract diagnostics
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.verify_upgrade)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: files-promise-contract-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/files-promise-verification.*/report.json
            ${{ runner.temp }}/files-promise-verification.*/run.log
            ${{ runner.temp }}/files-promise-verification.*/received-cleanup-controls.png
            ${{ runner.temp }}/files-promise-verification.*/received-cleanup-history.png
            ${{ runner.temp }}/files-promise-verification.*/received-restore-controls.png
          if-no-files-found: ignore
      - name: Verify interrupted received cleanup in a fresh app process
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_upgrade
        timeout-minutes: 2
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 scripts/verify-cleanup-restart.py --binary "$(swift build --show-bin-path)/FilesMac" --language en --theme light --checkpoint unrecorded
          python3 scripts/verify-cleanup-restart.py --binary "$(swift build --show-bin-path)/FilesMac" --language en --theme light --checkpoint journaled
      - name: Retain cleanup restart diagnostics
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.verify_upgrade)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: files-cleanup-restart-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/files-cleanup-restart.*/report.json
            ${{ runner.temp }}/files-cleanup-restart.*/interruption.json
            ${{ runner.temp }}/files-cleanup-restart.*/checkpoint.json
            ${{ runner.temp }}/files-cleanup-restart.*/interrupt.log
            ${{ runner.temp }}/files-cleanup-restart.*/inspect.log
            ${{ runner.temp }}/files-cleanup-restart.*/interrupted-cleanup-history.png
            ${{ runner.temp }}/files-cleanup-restart.*/received-restore-controls.png
            ${{ runner.temp }}/files-cleanup-restart.*/operations/promise-cleanup-*.json
          if-no-files-found: ignore
      - name: Prepare Spotlight for AppKit content search
        if: github.event_name == 'workflow_dispatch' && inputs.verify_full_appkit
        timeout-minutes: 4
        run: python3 scripts/prepare-spotlight-fixture.py prepare --isolated-volume --enable-indexing
      - name: Verify native Spotlight query scopes
        if: github.event_name == 'workflow_dispatch' && inputs.verify_full_appkit
        timeout-minutes: 2
        run: python3 scripts/verify-spotlight-fixture.py --binary "$(swift build --show-bin-path)/FilesMac"
      - name: Verify the complete AppKit suite
        if: github.event_name == 'workflow_dispatch' && inputs.verify_full_appkit
        timeout-minutes: ${{ matrix.appkit_step_minutes }}
        run: |
          export TMPDIR="$RUNNER_TEMP"
          bash scripts/verify-ui.sh --binary "$(swift build --show-bin-path)/FilesMac" --timeout-seconds "${{ matrix.appkit_timeout_seconds }}"
      - name: Retain AppKit reports and window captures
        if: always() && github.event_name == 'workflow_dispatch' && inputs.verify_full_appkit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: files-appkit-macos15-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/files-ui-verification.*/*/report.json
            ${{ runner.temp }}/files-ui-verification.*/*/progress.json
            ${{ runner.temp }}/files-ui-verification.*/*/desktop-session-comparison.json
            ${{ runner.temp }}/files-ui-verification.*/*/run.log
            ${{ runner.temp }}/files-ui-verification.*/*/timeout-sample.txt
            ${{ runner.temp }}/files-ui-verification.*/*/git-clone-timeout-*.txt
            ${{ runner.temp }}/files-ui-verification.*/*/git-clone-timeout-*.log
            ${{ runner.temp }}/files-ui-verification.*/*/git-window-timeout/*
            ${{ runner.temp }}/files-ui-verification.*/*/*.png
          if-no-files-found: ignore
      - name: Remove the owned Spotlight source fixture
        if: always() && github.event_name == 'workflow_dispatch' && inputs.verify_full_appkit
        run: python3 scripts/prepare-spotlight-fixture.py cleanup
      - name: Retain Spotlight preparation diagnostics
        if: always() && github.event_name == 'workflow_dispatch' && inputs.verify_full_appkit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: files-spotlight-${{ matrix.architecture }}
          path: |
            build/spotlight-fixture/state.json
            build/spotlight-fixture/native-queries/
            build/spotlight-unmounted-fixture/state.json
            build/spotlight-unmounted-fixture/verification.json
          if-no-files-found: ignore
      - name: Build and launch the installed developer preview
        if: github.event_name != 'pull_request'
        timeout-minutes: 15
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          bash scripts/build-dmg.sh --preview
          python3 scripts/verify-preview-install.py build/Files-macOS-preview.dmg \
            --startup --launch-services --expect-architecture "$EXPECTED_ARCH"
      - name: Check out the previous preview source
        if: github.event_name == 'workflow_dispatch' && inputs.verify_upgrade
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Previous preview with the Swift 6.2 compiler compatibility fix.
          ref: 0a7b50b50adfa810c8d93802e4b532f1ff2080e2
          path: build/previous-preview
          persist-credentials: false
      - name: Verify preview replacement and rollback
        if: github.event_name == 'workflow_dispatch' && inputs.verify_upgrade
        timeout-minutes: 17
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          bash build/previous-preview/scripts/build-dmg.sh --preview
          python3 scripts/verify-preview-install.py \
            build/previous-preview/build/Files-macOS-preview.dmg build/Files-macOS-preview.dmg \
            --expect-architecture "$EXPECTED_ARCH"

  verify-performance:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_performance
    name: Optimized performance (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify benchmark evidence validation
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s Tests/FixtureTests -p 'test_performance_baseline.py' -v
      - name: Measure optimized native performance
        run: |
          test "$(uname -m)" = "${{ matrix.architecture }}"
          bash scripts/verify-release-performance.sh current-candidate-performance full
      - name: Assess 20-process 10000-item baseline
        run: |
          python3 scripts/check-performance-baseline.py build/current-candidate-performance/report.json \
            --expected-source "${{ github.sha }}" --expected-architecture "${{ matrix.architecture }}" \
            --output build/current-candidate-performance/assessment.json
      - name: Retain raw measurements and assessment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: files-optimized-performance-${{ matrix.architecture }}
          path: build/current-candidate-performance
          if-no-files-found: ignore
